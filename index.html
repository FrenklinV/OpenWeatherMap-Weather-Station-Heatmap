<html lang="en">
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet</title>
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Load Cluster Files -->
    <link rel="stylesheet" href="https://pixel.uji.es/teaching/leaflet/markercluster-1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://pixel.uji.es/teaching/leaflet/markercluster-1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://pixel.uji.es/teaching/leaflet/markercluster-1.4.1/dist/leaflet.markercluster-src.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            width: 100vw;
            margin: 0;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    var OWM_key = "YOUR_OPENWEATHER_API_KEY_HERE"; // OpenWeatherMap API key
    var map = L.map('map').setView([39.9881, -0.0435], 12); // Default to Castellon

    // Tile Layer for the Map
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
}).addTo(map);


    // marker cluster group to handle many markers
    var markers = L.markerClusterGroup();

    // Function to fetch weather stations using the OpenWeatherMap API
    function populateWeatherStations(lat, lon) {
        var service_url = `https://api.openweathermap.org/data/2.5/find?lat=${lat}&lon=${lon}&appid=${OWM_key}&cnt=50&units=metric`;
        console.log("Service URL:", service_url);  // Log the URL for debugging

        fetch(service_url)
            .then(response => response.json())
            .then(data => {
                console.log("API Response:", data);  // Log the API response for debugging

                if (data.list && data.list.length > 0) {
                    var stations = data.list;  // Get stations from the API response

                    markers.clearLayers();  // Clear any previous markers

                    // Add a marker for each station
                    stations.forEach(station => {
                        var latLng = [station.coord.lat, station.coord.lon];  // Get station coordinates
                        var temperature = Math.round(station.main.temp);  // Get temperature for the station

                        // Create a marker and add it to the markers cluster
                        var marker = L.marker(latLng).addTo(markers);
                        marker.bindPopup(`<b>${station.name}</b><br>Temperature: ${temperature} ºC`);
                    });

                    // Add all markers to the map
                    map.addLayer(markers);
                } else {
                    console.error("No stations found in the response.");
                }
            })
            .catch(error => {
                console.error("Error fetching weather data:", error);
            });
    }

    // Use static coordinates for testing
    //populateWeatherStations(39.9881, -0.0435);  // Example: Castellon

    
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            populateWeatherStations(lat, lon);  // Get weather stations for the user's location
        }, function(error) {
            console.error("Error getting location: ", error);
            alert("Could not get your location.");
        });
    } else {
        alert("Geolocation is not supported in this browser.");
    }
</script>

</body>
</html>
